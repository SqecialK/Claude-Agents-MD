[project]
name = "btcmm"
version = "0.1.0"
description = "Measurement-first market-making research system for short-dated BTC Up/Down contracts (Kalshi, Polymarket US, Gemini Predictions)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "websockets>=12",
  "cryptography>=42",   # Kalshi RSA-PSS signing
  "pynacl>=1.5",        # Polymarket US Ed25519 signing
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
parquet = ["pyarrow>=15"]

[project.scripts]
btcmm = "btcmm.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["btcmm*"]
